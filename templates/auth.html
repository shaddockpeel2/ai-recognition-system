{% extends "base.html" %}

{% block title %}登录 - SafeHat{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 py-10 bg-[radial-gradient(circle_at_top,#12304d_0%,#08111c_45%,#05080d_100%)]">
    <div class="w-full max-w-5xl grid lg:grid-cols-2 rounded-3xl overflow-hidden border border-cyan-900/40 shadow-2xl bg-slate-950/80 backdrop-blur">
        <section class="hidden lg:flex flex-col justify-between p-10 bg-[linear-gradient(160deg,rgba(6,182,212,.15),rgba(14,23,38,.9))] border-r border-cyan-900/30">
            <div>
                <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-cyan-700/40 text-cyan-300 text-xs tracking-[0.2em] uppercase">
                    SafeHat Local Auth
                </div>
                <h1 class="mt-6 text-4xl font-black leading-tight text-white">本地账号登录</h1>
                <p class="mt-4 text-sm leading-7 text-slate-300">
                    账号和密码仅存储在当前设备本地文件中。登录后才可访问数据大屏、后台配置和检测接口。
                </p>
            </div>
        </section>

        <section class="p-6 sm:p-10">
            <div class="max-w-md mx-auto">
                <div class="flex items-center justify-between gap-4">
                    <div>
                        <h2 class="text-3xl font-bold text-white">登录系统</h2>
                        <p class="mt-2 text-sm text-slate-400">输入账号和密码继续。</p>
                    </div>
                </div>

                {% if auth_error %}
                <div class="mt-6 rounded-2xl border border-red-500/30 bg-red-950/40 px-4 py-3 text-sm text-red-200">
                    {{ auth_error }}
                </div>
                {% endif %}

                <form method="post" class="mt-6 space-y-4">
                    <input type="hidden" name="next" value="{{ next_url }}">
                    <div>
                        <label class="block text-sm text-slate-300 mb-2">用户名</label>
                        <input
                            type="text"
                            name="username"
                            required
                            minlength="3"
                            autocomplete="username"
                            class="w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-cyan-400"
                        >
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-2">密码</label>
                        <input
                            type="password"
                            name="password"
                            required
                            minlength="6"
                            autocomplete="current-password"
                            class="w-full rounded-2xl border border-slate-700 bg-slate-900 px-4 py-3 text-white outline-none focus:border-cyan-400"
                        >
                    </div>
                    <button
                        type="submit"
                        class="w-full rounded-2xl bg-cyan-400 px-4 py-3 font-bold text-slate-950 transition hover:bg-cyan-300"
                    >
                        登录
                    </button>
                </form>
            </div>
        </section>
    </div>
    <div class="fixed bottom-3 left-0 right-0 text-center text-xs text-slate-500 pointer-events-none">
        开发单位：南京两木峰安全科技有限公司
    </div>
</div>
{% endblock %}
